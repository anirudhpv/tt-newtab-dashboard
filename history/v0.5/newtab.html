<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TigerTracks</title>
<style>
:root { --teal:#229FA1; --ink:#0A1119; --surface:#1B2126; --text:#e8edf2; --text-dim:#7a92a4; }
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--ink); color:var(--text); font-family:'Segoe UI',sans-serif; font-size:14px; min-height:100vh; }
#app { max-width:1400px; margin:0 auto; padding:24px; display:grid; grid-template-rows:auto 1fr auto; gap:20px; min-height:100vh; }
header { display:flex; align-items:center; justify-content:space-between; padding-bottom:14px; border-bottom:1px solid rgba(255,255,255,.07); }
.logo img { height:36px; mix-blend-mode:screen; }
main { display:grid; grid-template-columns:1fr 280px; gap:16px; }
.left { display:flex; flex-direction:column; gap:16px; }
.card { background:var(--surface); border:1px solid rgba(255,255,255,.07); border-radius:10px; padding:16px; }
.card-label { font-size:9px; font-weight:600; letter-spacing:1.5px; text-transform:uppercase; color:var(--teal); margin-bottom:12px; }
#hero-time { font-size:72px; font-weight:300; letter-spacing:-3px; line-height:1; }
#hero-date { font-size:13px; color:var(--text-dim); margin-top:6px; }
.tz-grid { display:grid; grid-template-columns:repeat(8,1fr); gap:8px; }
.tz-cell { padding:8px; background:rgba(255,255,255,.04); border-radius:6px; text-align:center; }
.tz-city { font-size:8px; color:var(--text-dim); text-transform:uppercase; }
.tz-time { font-size:15px; font-weight:500; margin-top:2px; }
.pill-toggle { display:flex; background:rgba(255,255,255,.06); border-radius:20px; padding:2px; gap:0; }
.pill-btn { padding:4px 12px; font-size:10px; border:none; background:none; color:var(--text-dim); cursor:pointer; border-radius:18px; }
.pill-btn.active { background:var(--teal); color:#fff; }
#world-canvas { width:100%; height:auto; display:block; border-radius:6px; }
.wx-temp { font-size:48px; font-weight:300; }
.link-item { display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:6px; text-decoration:none; color:var(--text); font-size:12px; }
.link-item:hover { background:rgba(34,159,161,.1); }
.link-fav { width:14px; height:14px; border-radius:2px; }
.chat-messages { min-height:80px; max-height:180px; overflow-y:auto; margin-bottom:10px; display:flex; flex-direction:column; gap:8px; }
.msg { padding:8px 10px; border-radius:8px; font-size:12px; max-width:90%; }
.msg.user { background:var(--teal); color:#fff; align-self:flex-end; }
.msg.assistant { background:rgba(255,255,255,.06); align-self:flex-start; }
.chat-row { display:flex; gap:6px; }
.chat-in { flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:6px; padding:7px 10px; color:var(--text); font-size:12.5px; outline:none; }
.chat-btn { padding:7px 14px; background:var(--teal); border:none; border-radius:6px; color:#fff; font-weight:600; cursor:pointer; font-size:12px; }
.source-card { display:flex; align-items:center; gap:6px; padding:5px 7px; background:rgba(255,255,255,.04); border-radius:6px; text-decoration:none; margin-top:4px; font-size:10px; color:var(--text-dim); }
.source-card:hover { background:rgba(34,159,161,.1); color:var(--teal); }
footer { font-size:9.5px; color:var(--text-dim); display:flex; justify-content:space-between; padding-top:12px; border-top:1px solid rgba(255,255,255,.06); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><img id="tt-logo" src="tt_white_logo.png" alt="TigerTracks"></div>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="theme-btn" style="background:none;border:1px solid rgba(255,255,255,.15);border-radius:6px;color:var(--text-dim);padding:5px 10px;cursor:pointer;font-size:12px;">☀</button>
      <button id="settings-btn" style="background:none;border:1px solid rgba(255,255,255,.15);border-radius:6px;color:var(--text-dim);padding:5px 10px;cursor:pointer;font-size:12px;">⚙</button>
    </div>
  </header>
  <main>
    <div class="left">
      <div class="card">
        <div id="hero-time">00:00</div>
        <div id="hero-date"></div>
      </div>
      <div class="card">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
          <div class="card-label" style="margin-bottom:0">World Clocks</div>
          <div class="pill-toggle">
            <button class="pill-btn active" id="tz-grid-btn">⊞ Grid</button>
            <button class="pill-btn" id="tz-map-btn">🌐 Map</button>
          </div>
        </div>
        <div id="tz-grid-view"><div class="tz-grid" id="tz-grid"></div></div>
        <div id="tz-map-view" style="display:none">
          <canvas id="world-canvas" width="900" height="460"></canvas>
        </div>
      </div>
      <div class="card" style="flex:1">
        <div class="card-label">GLM — Z.ai</div>
        <div class="chat-messages" id="chat-messages">
          <div style="color:var(--text-dim);font-size:12px;padding:16px;text-align:center;font-style:italic">Ask anything — strategy, copy, analysis, research.</div>
        </div>
        <div class="chat-row">
          <input type="text" class="chat-in" id="chat-in" placeholder="Ask GLM…">
          <button class="chat-btn" id="chat-send">Send</button>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="card">
        <div class="card-label">Weather</div>
        <div id="weather"><div style="color:var(--text-dim);font-size:12px">Detecting location…</div></div>
      </div>
      <div class="card" style="flex:1">
        <div class="card-label">Quick Links</div>
        <div id="links-list"></div>
      </div>
    </div>
  </main>
  <footer>
    <span style="color:var(--teal)">TigerTracks</span>
    <span id="footer-date"></span>
  </footer>
</div>
<script src="js/topojson.min.js"></script>
<script src="newtab.js"></script>
</body>
</html>
